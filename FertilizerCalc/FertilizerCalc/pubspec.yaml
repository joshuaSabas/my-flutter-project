name: app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.5.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_bluetooth_serial_plus: ^0.5.6
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1 # Idinagdag para sa itim na screen

flutter:
  uses-material-design: true

  assets:
    - images/
    - assets/fertilizer_rules.json

# Configuration para sa App Icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/icon.png" # Siguraduhing "icon.png" ang file name sa iyong images folder

# Configuration para sa Itim na Screen (Splash Screen)
flutter_native_splash:
  color: "#000000" # Gagawing purong itim ang screen
  # Walang image_path na nilagay dito kaya walang Flutter logo o kahit anong logo na lalabas
  android_12:
    color: "#000000" # Para sa mga bagong bersyon ng Android
