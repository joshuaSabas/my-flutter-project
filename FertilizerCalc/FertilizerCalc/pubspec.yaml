name: app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.5.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_email_sender: ^6.0.1
  flutter_bluetooth_serial_plus: ^0.5.6
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - images/
    - assets/
    - assets/random_forest.json
    - assets/labels.json
    - assets/fertilizer_rules.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/icon.png"

flutter_native_splash:
  color: "#000000"
  android_12:
    color: "#000000"
