name: app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - images/
    - assets/fertilizer_rules.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/icon.png"  # ← GAMITIN MO ITO (OR logo.png)
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "images/icon.png"  # ← ITO RIN
